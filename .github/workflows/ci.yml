# CI (PLAN §10.2). Railway's "Wait for CI" deploys main only after every job here is green.
# Actions are pinned to full commit SHAs; the trailing comment names the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ct
          POSTGRES_PASSWORD: ct
          POSTGRES_DB: culture_terminal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U ct -d culture_terminal"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Same credentials as docker-compose.yml; a throwaway database that lives for this job only.
      DATABASE_URL: postgres://ct:ct@localhost:5432/culture_terminal
    steps:
      - name: Check out (full history, for guard --history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Guard working tree
        run: pnpm guard

      - name: Guard history
        run: pnpm guard --history

      - name: Build
        run: pnpm build

      - name: Guard client bundle
        run: pnpm guard --bundle

      # The smoke starts its own dev server in mock mode (playwright.config.ts): synthetic Qloo and public
      # data, blank model and Qloo keys, so nothing live is called. The map cards need the internet for
      # the OpenFreeMap basemap. It runs every Playwright project, the 390 px phone check included
      # (phone-iphone and phone-android: Chromium with each phone's user agent, viewport and pixel ratio).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke (mock mode)
        run: pnpm smoke
        env:
          QLOO_MOCK: "1"
          QLOO_API_KEY: ""
          ANTHROPIC_API_KEY: ""

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The CLI rather than gitleaks-action: the action scans only the pushed commit range,
      # and this job must scan every commit on every ref.
      - name: Install gitleaks (checksum verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # The default rules plus .gitleaks.toml's narrow allowlists (each with its reason); .gitleaksignore
      # holds the fingerprints of synthetic fixtures already in history.
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --config .gitleaks.toml --log-opts="--all" .'
